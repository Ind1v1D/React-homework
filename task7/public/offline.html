<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#2f66f0" />
<title>Offline – CineRate</title>
<style>
  :root{--bg:#0b1020;--surface:#121a30;--surface-raised:#1a2440;--border:#2a3558;--text:#eef1f8;--muted:#a5aec6;--primary:#2f66f0;--primary-hover:#2557d6;--accent:#f5b04d}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;text-align:center}
  .card{width:100%;max-width:420px;padding:32px 16px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
  .icon{width:56px;height:56px;margin:0 auto 16px;border-radius:12px;background:var(--surface-raised);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .icon svg{width:28px;height:28px}
  h1{margin:0 0 8px;font-size:1.25rem;line-height:1.3;text-wrap:balance}
  p{margin:0 auto 24px;max-width:36ch;color:var(--muted);text-wrap:pretty}
  button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:background-color .12s,transform .12s}
  button:hover{background:var(--primary-hover)}
  button:active:not(:disabled){transform:scale(.97)}
  button:focus-visible{outline:2px solid #8aa9ff;outline-offset:2px}
  button:disabled{background:var(--surface-raised);color:#8f99b5;cursor:wait}
  #status{min-height:1.6em;margin:16px auto 0;font-size:.875rem;color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M5 12.9a10 10 0 015.2-2.8M19 12.9a10 10 0 00-2.5-1.9M8.5 16.4a5 5 0 017 0"/><path d="M12 20h.01"/></svg></div>
  <h1>You're offline</h1>
  <p>CineRate can't reach the network. Pages and movies you've already viewed may still open from the cache; everything else loads once you're back online.</p>
  <button id="retry" type="button">Retry connection</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  var btn = document.getElementById('retry');
  var statusEl = document.getElementById('status');
  function check() {
    btn.disabled = true;
    statusEl.textContent = 'Checking connection...';
    return fetch('./manifest.json?ping=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('bad status');
        location.href = './';
      })
      .catch(function () {
        statusEl.textContent = 'Still offline. Check your connection and try again.';
        btn.disabled = false;
      });
  }
  btn.addEventListener('click', check);
  window.addEventListener('online', check);
</script>
</body>
</html>
